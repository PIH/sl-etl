type: "job-pipeline"
description: "Refreshing OpenMRS Data for CI"
configuration:
  jobs:
    - type: "iterating-job"
      description: "Refreshing OpenMRS Data for KGH Test"
      configuration:
        iterations:
          - siteName: "kgh"
        jobTemplate:
          path: "refresh-${siteName}.yml"

    - type: "iterating-job"
      description: "Prepare data warehouse"
      configuration:
        jobTemplate:
          path: "prepare_dwh.yml"
        iterations:
          - scriptName: "create_functions"
          
    # Chiefdom -> lat/long mapping for the Power BI map. Source of truth is jobs/data/chiefdom_coordinates.csv
    # (edit the CSV to change coordinates). Read via in-memory H2 (CSVREAD) and bulk-loaded; table is dropped and recreated.
    - type: "sqlserver-bulk-import"
      description: "Loading chiefdom_coordinates from CSV"
      parameters:
        csvFile: "${petl.jobDir}/data/chiefdom_coordinates.csv"
      configuration:
        extract:
          datasource: "csv-files.yml"
          query: "sql/extractions/chiefdom_coordinates.sql"
        load:
          datasource: "warehouse.yml"
          table: "chiefdom_coordinates"
          schema: "sql/schemas/chiefdom_coordinates.sql"

    - type: "iterating-job"
      description: "Create derived staging tables"
      configuration:
        jobTemplate:
          path: "create-derived-table-in-warehouse.yml"
        iterations:
          - tableName: "dim_date"
          - tableName: "mch_pregnancy_summary"
          - tableName: "moh_maternity_and_delivery_data"
          - tableName: "moh_epi_tetanus_data"
          - tableName: "moh_postnatal_care_data"
          - tableName: "moh_family_planning_data"
          
    - type: "iterating-job"
      description: "Create final derived tables"
      configuration:
        jobTemplate:
          path: "create-derived-table-in-warehouse.yml"
        iterations:
          - tableName: "update_index"
          - tableName: "drop_old_tables"
          - tableName: "drug_categories"
          - tableName: "ncd_monthly_summary"
          - tableName: "mch_maternity_patient"
          - tableName: "mch_anc_monthly_summary"
          - tableName: "ncd_penplus_disease_condition"          
          - tableName: "append_data_warnings"
          - tableName: "duplicate_patient_warnings"
          - tableName: "update_patient_url"
          - tableName: "dispensed_medication_summary"
          - tableName: "moh_postnatal_care"  
          - tableName: "moh_maternity_and_delivery"
          - tableName: "moh_epi_tetanus"   
          - tableName: "moh_family_planning"          
          - tableName: "all_admissions"
          - tableName: "mcoe_patient_workflow"
          - tableName: "ncd_patient_tracking"

    - type: "iterating-job"
      description: "Create mcoe tables"
      configuration:
        jobTemplate:
          path: "create-derived-table-in-warehouse.yml"
        iterations:
          - tableName: "create_mcoe_tables"
